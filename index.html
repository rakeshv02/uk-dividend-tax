<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Investment Calculator — Lump Sum & Monthly Contributions | Tabutility</title>
  <meta name="description" content="Calculate future investment value with lump sum and monthly contributions. See growth charts, compound interest and total returns." />
  <meta name="keywords" content="investment calculator, lump sum calculator, monthly investment calculator, compound interest, future value calculator" />
  <link rel="canonical" href="https://investment.tabutility.com/" />
  <meta property="og:title" content="Investment Calculator" />
  <meta property="og:description" content="See how your investment grows with lump sum and monthly contributions over time." />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>" />
  <meta name="robots" content="index, follow" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7039091592734005" crossorigin="anonymous"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-78VZWJ5B1W"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-78VZWJ5B1W');</script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin:0;background:#f8faff;font-family:'Segoe UI',Arial,sans-serif">
<div id="root"></div>
<script type="text/babel">
//<![CDATA[
const { useState, useMemo } = React;
function fmt(n){return '$'+Math.round(n).toLocaleString();}

function App() {
  const [initial, setInitial] = useState(10000);
  const [monthly, setMonthly] = useState(500);
  const [rate, setRate] = useState(8);
  const [years, setYears] = useState(20);
  const [compound, setCompound] = useState('monthly');

  const freq = compound === 'monthly' ? 12 : compound === 'quarterly' ? 4 : 1;
  const r = Number(rate)/100/freq;
  const n = Number(years) * freq;
  const m = Number(monthly) * (12/freq);

  const futureInitial = Number(initial) * Math.pow(1+r, n);
  const futureMonthly = r > 0 ? m * (Math.pow(1+r,n)-1)/r : m*n;
  const total = futureInitial + futureMonthly;
  const totalContributions = Number(initial) + Number(monthly)*12*Number(years);
  const totalInterest = total - totalContributions;

  const milestones = useMemo(()=>{
    const pts = [];
    for(let y=1; y<=Number(years); y++) {
      const ni = Number(years) * (12/freq) > 0 ? y*freq : y;
      const fi = Number(initial)*Math.pow(1+r,y*freq);
      const fm = r>0?m*(Math.pow(1+r,y*freq)-1)/r:m*y*freq;
      pts.push({ year:y, value: fi+fm });
    }
    return pts;
  }, [initial, monthly, rate, years, compound]);

  const maxVal = milestones.length ? milestones[milestones.length-1].value : 1;
  const showEvery = Number(years) <= 10 ? 1 : Number(years) <= 20 ? 5 : 10;

  return (
    <div style={{maxWidth:540,margin:'0 auto',paddingBottom:40}}>
      <div style={{background:'#1a1a2e',padding:'12px 20px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <a href="https://tabutility.com" style={{color:'#a5b4fc',textDecoration:'none',fontSize:14}}>← All Tools</a>
        <span style={{color:'#fff',fontWeight:700,fontSize:15}}>⚡ Tabutility</span>
      </div>
      <div style={{background:'linear-gradient(135deg,#1d4ed8,#1e40af)',padding:'28px 20px',textAlign:'center',color:'#fff'}}>
        <div style={{fontSize:36,marginBottom:8}}>📊</div>
        <h1 style={{margin:'0 0 6px',fontSize:22,fontWeight:900}}>Investment Calculator</h1>
        <p style={{margin:0,fontSize:13,opacity:0.85}}>Lump sum · monthly contributions · compound growth</p>
      </div>
      <div style={{padding:20}}>
        <div style={{background:'#fff',borderRadius:14,padding:20,boxShadow:'0 2px 12px rgba(0,0,0,0.06)',marginBottom:16}}>
          {[['Initial Investment','$',initial,setInitial],['Monthly Contribution','$',monthly,setMonthly]].map(([l,p,v,s])=>(
            <div key={l} style={{marginBottom:14}}>
              <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',marginBottom:6}}>{l}</label>
              <div style={{position:'relative'}}>
                <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:'#6b7280'}}>{p}</span>
                <input type="number" value={v} onChange={e=>s(e.target.value)}
                  style={{width:'100%',padding:'11px 12px 11px 28px',borderRadius:10,border:'2px solid #e5e7eb',fontSize:16,boxSizing:'border-box'}} />
              </div>
            </div>
          ))}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:14}}>
            <div>
              <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',marginBottom:6}}>Annual Return: <span style={{color:'#1d4ed8'}}>{rate}%</span></label>
              <input type="range" min={1} max={30} step={0.5} value={rate} onChange={e=>setRate(e.target.value)} style={{width:'100%',accentColor:'#1d4ed8'}} />
            </div>
            <div>
              <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',marginBottom:6}}>Years: <span style={{color:'#1d4ed8'}}>{years}</span></label>
              <input type="range" min={1} max={50} step={1} value={years} onChange={e=>setYears(e.target.value)} style={{width:'100%',accentColor:'#1d4ed8'}} />
            </div>
          </div>
          <div>
            <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',marginBottom:6}}>Compounding</label>
            <div style={{display:'flex',gap:8}}>
              {[['monthly','Monthly'],['quarterly','Quarterly'],['annually','Annually']].map(([v,l])=>(
                <button key={v} onClick={()=>setCompound(v)} style={{flex:1,padding:'8px',borderRadius:8,border:`2px solid ${compound===v?'#1d4ed8':'#e5e7eb'}`,background:compound===v?'#1d4ed8':'#fff',color:compound===v?'#fff':'#374151',fontWeight:600,cursor:'pointer',fontSize:12}}>{l}</button>
              ))}
            </div>
          </div>
        </div>

        <div style={{background:'linear-gradient(135deg,#eff6ff,#dbeafe)',borderRadius:14,padding:24,textAlign:'center',marginBottom:16}}>
          <div style={{fontSize:13,fontWeight:700,color:'#1e40af'}}>FUTURE VALUE after {years} years</div>
          <div style={{fontSize:48,fontWeight:900,color:'#1d4ed8',margin:'6px 0'}}>{fmt(total)}</div>
          <div style={{display:'flex',gap:20,justifyContent:'center',marginTop:8,fontSize:13}}>
            <div><span style={{color:'#6b7280'}}>Contributed: </span><strong style={{color:'#374151'}}>{fmt(totalContributions)}</strong></div>
            <div><span style={{color:'#6b7280'}}>Growth: </span><strong style={{color:'#16a34a'}}>+{fmt(totalInterest)}</strong></div>
          </div>
        </div>

        <div style={{background:'#fff',borderRadius:14,padding:16,boxShadow:'0 2px 12px rgba(0,0,0,0.06)',marginBottom:16}}>
          <div style={{fontWeight:700,fontSize:13,color:'#374151',marginBottom:12}}>Growth Over Time</div>
          <div style={{display:'flex',flexDirection:'column',gap:6}}>
            {milestones.filter(m=>m.year%showEvery===0||m.year===1||m.year===Number(years)).map(m=>(
              <div key={m.year} style={{display:'flex',alignItems:'center',gap:10}}>
                <span style={{fontSize:12,color:'#9ca3af',width:48,flexShrink:0}}>Yr {m.year}</span>
                <div style={{flex:1,background:'#f3f4f6',borderRadius:6,height:20,overflow:'hidden'}}>
                  <div style={{background:'#1d4ed8',height:'100%',width:`${Math.max(2,m.value/maxVal*100)}%`,borderRadius:6,transition:'width 0.3s'}} />
                </div>
                <span style={{fontSize:12,fontWeight:700,color:'#1d4ed8',width:80,textAlign:'right',flexShrink:0}}>{fmt(m.value)}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
//]]>
</script>
</body>
</html>
